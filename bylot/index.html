<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ─────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── Primary SEO ──────────────────────────────────── -->
    <title>Bylot – Buy Near-Expiry &amp; Discounted Goods Near You | Save Up to 70%</title>
    <meta name="description" content="Bylot is India's hyperlocal marketplace for near-expiry, surplus and discounted goods. Find fresh produce, dairy, bakery and daily essentials at up to 70% off from local sellers near you." />
    <meta name="author" content="Nagarjuna B V" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="application-name" content="Bylot" />
    <meta name="generator" content="Vite + React" />

    <!-- ── Canonical ────────────────────────────────────── -->
    <link rel="canonical" href="https://bylot.in/" />

    <!-- ── Open Graph ───────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Bylot" />
    <meta property="og:title"       content="Bylot – Buy Near-Expiry &amp; Discounted Goods Near You" />
    <meta property="og:description" content="India's hyperlocal marketplace for near-expiry, surplus and discounted goods. Save up to 70% on fresh produce, dairy, bakery and daily essentials." />
    <meta property="og:url"         content="https://bylot.in/" />
    <meta property="og:image"       content="https://bylot.in/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Bylot – hyperlocal discount marketplace" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ─────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@bylot_in" />
    <meta name="twitter:creator"     content="@bylot_in" />
    <meta name="twitter:title"       content="Bylot – Buy Near-Expiry &amp; Discounted Goods Near You" />
    <meta name="twitter:description" content="India's hyperlocal marketplace for near-expiry, surplus and discounted goods. Save up to 70%." />
    <meta name="twitter:image"       content="https://bylot.in/og-image.png" />
    <meta name="twitter:image:alt"   content="Bylot – hyperlocal discount marketplace" />

    <!-- ── PWA / Theme ──────────────────────────────────── -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bylot" />
    <meta name="msapplication-TileColor" content="#4F46E5" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- ── Icons & Manifest ─────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Preconnect (performance → helps CWV) ─────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <!-- ── Organisation structured data (baseline) ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bylot",
      "url": "https://bylot.in",
      "logo": "https://bylot.in/og-image.png",
      "description": "India's hyperlocal marketplace for near-expiry, surplus and discounted goods.",
      "email": "nagarjunavenkatesan@gmail.com",
      "founder": { "@type": "Person", "name": "Nagarjuna B V" },
      "sameAs": ["https://twitter.com/bylot_in"]
    }
    </script>

    <!-- ── Website / Sitelinks Searchbox ─────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bylot",
      "url": "https://bylot.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bylot.in/browse?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

services:
  mysql:
    image: mysql:8.0
    container_name: bylot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-bylot}
      MYSQL_USER: ${DB_USER:-bylot_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/config/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bylot-network
    # Port 3306 is isolated inside the Docker network.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-bylot_user}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bylot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-bylot_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-bylot}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://bylot.in,https://www.bylot.in}
      FRONTEND_URL: ${FRONTEND_URL:-https://bylot.in}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-358858464400-6di0qk18deq2fejn7g3f830i2g5fr1nf.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-https://bylot.in}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Bylot <no-reply@bylot.in>}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      SKIP_SMTP_CHECK: ${SKIP_SMTP_CHECK:-false}
    volumes:
      - uploads_data:/app/uploads
      - frontend_dist:/bylot/dist:ro
    networks:
      - bylot-network
    # Bound to localhost only if direct backend inspection is needed; otherwise reached via frontend reverse proxy
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./bylot
      dockerfile: Dockerfile
    container_name: bylot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_dist:/usr/share/nginx/html
    # Bound to 127.0.0.1:8080 to prevent collision with host Nginx on ports 80/443
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - bylot-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  frontend_dist:
    driver: local

networks:
  bylot-network:
    driver: bridge

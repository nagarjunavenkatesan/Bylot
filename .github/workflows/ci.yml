name: Bylot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Audit, Test & Security
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: bylot_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      CI_MYSQL_PWD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Required CI Secrets
        run: |
          if [ -z "${{ secrets.CI_MYSQL_ROOT_PASSWORD }}" ]; then
            echo "::error::Required secret CI_MYSQL_ROOT_PASSWORD is missing in repository settings. Failing CI."
            exit 1
          fi

      - name: Generate Ephemeral Test Secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REPORT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Block Telegram code
        run: |
          if git grep -i -E "telegram|botfather|bot_token|api\.telegram" -- ":!*.test.js" ":!.github/**" ":!*.md"; then
            echo "Telegram references found"
            exit 1
          else
            echo "No Telegram references"
          fi

      - name: Block Payment code
        run: |
          echo "Verifying zero active payment functionality..."
          # 1. Block payment gateway provider SDKs and keywords in active code
          if git grep -i -E "razorpay|stripe|paypal|cashfree|paytm" -- ":!*migrations*" ":!docs/MIGRATIONS.md" ":!*.test.js" ":!.github/**" ":!*.md" ":!*package-lock.json"; then
            echo "Error: Payment gateway provider references found!"
            exit 1
          fi
          # 2. Block active payment routes and webhooks
          if git grep -i -E "\.(get|post|put|patch|delete)\s*\(['\"].*(/payment|/checkout|/webhook)" -- ":!*.test.js" ":!.github/**" ":!*.md"; then
            echo "Error: Active payment or checkout API routes found!"
            exit 1
          fi
          # 3. Block client payment initiation and gateway calls
          if git grep -i -E "\b(makePayment|payNow|verifyPayment|processPayment|initiatePayment|new Razorpay|new Stripe|loadStripe)\s*\(" -- ":!*.test.js" ":!.github/**" ":!*.md"; then
            echo "Error: Payment function calls found!"
            exit 1
          fi
          # 4. Block payment credentials / environment variables
          if git grep -i -E "\b(RAZORPAY_|STRIPE_|PAYPAL_|CASHFREE_)(KEY|SECRET|TOKEN|ID|WEBHOOK)" -- ":!*.test.js" ":!.github/**" ":!*.md"; then
            echo "Error: Payment credentials found in configuration!"
            exit 1
          fi
          # 5. Block active payment database tables or columns outside migrations
          if git grep -i -E "\b(payment_status|payment_method|payment_id)\b|CREATE TABLE.*payments" -- ":!*migrations*" ":!*.test.js" ":!.github/**" ":!*.md"; then
            echo "Error: Active payment database schema columns found!"
            exit 1
          fi
          echo "Verified: ZERO active payment functionality in repository."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Lint Backend
        working-directory: backend
        run: npm run lint

      - name: Security Audit (Production Dependencies)
        working-directory: backend
        run: npm audit --omit=dev

      - name: Initialize test database
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ env.CI_MYSQL_PWD }}
          DB_NAME: bylot_test
        run: |
          node init_db.js
          node scripts/migrate.js --db bylot_test

      - name: Run Backend Tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ env.CI_MYSQL_PWD }}
          DB_NAME: bylot_test
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          REPORT_ENCRYPTION_KEY: ${{ env.REPORT_ENCRYPTION_KEY }}
        run: npm test

      - name: Security audit script
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          REPORT_ENCRYPTION_KEY: ${{ env.REPORT_ENCRYPTION_KEY }}
        run: npm run security-audit

      - name: Database backup & restore test
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ env.CI_MYSQL_PWD }}
          DB_NAME: bylot_test
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          REPORT_ENCRYPTION_KEY: ${{ env.REPORT_ENCRYPTION_KEY }}
        run: npm run backup-test

      - name: Report archive & encryption verification
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ env.CI_MYSQL_PWD }}
          DB_NAME: bylot_test
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          REPORT_ENCRYPTION_KEY: ${{ env.REPORT_ENCRYPTION_KEY }}
        run: npm run encryption-test

      - name: Load & stress benchmark test
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ env.CI_MYSQL_PWD }}
          DB_NAME: bylot_test
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          REPORT_ENCRYPTION_KEY: ${{ env.REPORT_ENCRYPTION_KEY }}
        run: npm run stress-test

  frontend:
    name: Frontend Lint, Audit, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: bylot/package-lock.json

      - name: Install Dependencies
        working-directory: bylot
        run: npm ci

      - name: Lint Frontend
        working-directory: bylot
        run: npm run lint

      - name: Security Audit (Production Dependencies)
        working-directory: bylot
        run: npm audit --omit=dev

      - name: Pricing unit tests
        working-directory: bylot
        run: npm run test

      - name: Build Frontend Bundle
        working-directory: bylot
        run: npm run build
